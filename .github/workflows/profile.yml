name: Update GitHub Profile

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create profile directory
        run: |
          rm -rf profile
          mkdir -p profile
          mkdir -p dist

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&hide_title=false&hide_rank=false&show_icons=true&include_all_commits=true&count_private=true&disable_animations=false&theme=dracula&locale=en&hide_border=false
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Pacman Contribution Graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Copy Pacman files
        run: |
          cp dist/pacman-contribution-graph.svg profile/pacman-contribution-graph.svg
          cp dist/pacman-contribution-graph-dark.svg profile/pacman-contribution-graph-dark.svg

      - name: Download Trophy
        run: |
          curl -fL "https://github-profile-trophy.vercel.app/?username=namanhere23&theme=dracula&column=-1&row=1&margin-w=8&margin-h=8&no-bg=false&no-frame=false" \
          -o profile/trophy.svg

      - name: Verify files
        run: |
          echo "Generated profile files:"
          ls -lh profile/

          test -s profile/stats.svg
          test -s profile/trophy.svg
          test -s profile/pacman-contribution-graph.svg
          test -s profile/pacman-contribution-graph-dark.svg

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update GitHub profile graphs"
            git push
          fi